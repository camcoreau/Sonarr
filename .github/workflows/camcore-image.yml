name: Build CamCore Sonarr image

on:
  pull_request:
    branches:
      - v5-develop
    paths:
      - "frontend/src/Content/Images/logo-full.png"
      - "frontend/src/Content/Images/camcore-logo.svg"
      - "frontend/src/Content/Images/Icons/camcore-*"
      - "frontend/src/Content/camcore-manifest.json"
      - "frontend/src/Content/camcore-header.css"
      - "frontend/src/login.html"
      - "Dockerfile.camcore"
      - ".github/workflows/camcore-image.yml"
  push:
    branches:
      - v5-develop
    paths:
      - "frontend/src/Content/Images/logo-full.png"
      - "frontend/src/Content/Images/camcore-logo.svg"
      - "frontend/src/Content/Images/Icons/camcore-*"
      - "frontend/src/Content/camcore-manifest.json"
      - "frontend/src/Content/camcore-header.css"
      - "frontend/src/login.html"
      - "Dockerfile.camcore"
      - ".github/workflows/camcore-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: camcore-sonarr-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/camcoreau/sonarr
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.camcore
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
